<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #7c3aed;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --dark-bg: #1f2937;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary-color) !important;
      font-size: 1.5rem;
    }

    .main-container {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .page-header {
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 2.5rem;
    }

    .stats-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      border: 2px solid #f3f4f6;
      height: 100%;
    }

    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15);
    }

    .stats-card.primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .stats-card.success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .stats-card.warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .stats-card.danger {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }

    .stats-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 1rem;
    }

    .stats-value {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .stats-label {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .search-box {
      position: relative;
      margin-bottom: 2rem;
    }

    .search-box input {
      border-radius: 50px;
      padding: 1rem 3rem 1rem 3rem;
      border: 2px solid #e5e7eb;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .table-container {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .table {
      margin-bottom: 0;
    }

    .table thead {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .table thead th {
      border: none;
      padding: 1.25rem 1rem;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }

    .table tbody tr {
      transition: all 0.2s;
      border-bottom: 1px solid #f3f4f6;
    }

    .table tbody tr:hover {
      background-color: #f9fafb;
      transform: scale(1.01);
    }

    .table tbody td {
      padding: 1.25rem 1rem;
      vertical-align: middle;
    }

    .user-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-name {
      font-weight: 600;
      color: var(--dark-bg);
      margin-bottom: 0.25rem;
    }

    .user-email {
      color: #6b7280;
      font-size: 0.875rem;
    }

    .badge-status {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-admin {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-user {
      background: #dcfce7;
      color: #166534;
    }

    .action-btn {
      width: 35px;
      height: 35px;
      border-radius: 8px;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin: 0 0.25rem;
    }

    .action-btn:hover {
      transform: scale(1.1);
    }

    .btn-edit {
      background: #dbeafe;
      color: #1e40af;
    }

    .btn-delete {
      background: #fee2e2;
      color: #dc2626;
    }

    .loading {
      text-align: center;
      padding: 3rem;
    }

    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state i {
      font-size: 5rem;
      color: #e5e7eb;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }

      .stats-value {
        font-size: 2rem;
      }

      .table-container {
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fas fa-shopping-bag me-2"></i>Microservice Store
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="product.html"><i class="fas fa-box me-1"></i>Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="order.html"><i class="fas fa-shopping-cart me-1"></i>Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="auth.html"><i class="fas fa-users me-1"></i>Users</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="main-container">
      <div class="page-header">
        <h1><i class="fas fa-users-cog me-2"></i>User Management</h1>
        <p class="text-muted mb-0">Monitor and manage user accounts</p>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stats-card primary">
            <div class="stats-icon">
              <i class="fas fa-users"></i>
            </div>
            <div class="stats-value" id="totalUsers">0</div>
            <div class="stats-label">Total Users</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stats-card success">
            <div class="stats-icon">
              <i class="fas fa-user-shield"></i>
            </div>
            <div class="stats-value" id="adminCount">0</div>
            <div class="stats-label">Administrators</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stats-card warning">
            <div class="stats-icon">
              <i class="fas fa-user"></i>
            </div>
            <div class="stats-value" id="userCount">0</div>
            <div class="stats-label">Regular Users</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stats-card danger">
            <div class="stats-icon">
              <i class="fas fa-user-clock"></i>
            </div>
            <div class="stats-value" id="activeCount">0</div>
            <div class="stats-label">Active Today</div>
          </div>
        </div>
      </div>

      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="form-control" id="searchInput" placeholder="Search users by username or role...">
      </div>

      <div id="loadingState" class="loading">
        <div class="loading-spinner mx-auto"></div>
        <p class="mt-3 text-muted">Loading users...</p>
      </div>

      <div id="tableContainer" class="table-container" style="display: none;">
        <table class="table">
          <thead>
            <tr>
              <th>USER</th>
              <th>CREATED DATE</th>
              <th>ROLE</th>
              <th class="text-center">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-user-slash"></i>
        <h3>No users found</h3>
        <p class="text-muted">Try adjusting your search criteria.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    let allUsers = [];

    async function loadUsers() {
      const loadingState = document.getElementById('loadingState');
      const tableContainer = document.getElementById('tableContainer');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'block';
      tableContainer.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const response = await fetch('/auth/users');
        allUsers = await response.json();

        loadingState.style.display = 'none';

        if (allUsers.length === 0) {
          emptyState.style.display = 'block';
        } else {
          tableContainer.style.display = 'block';
          updateStats();
          renderUsers(allUsers);
        }
      } catch (error) {
        console.error('Error fetching users:', error);
        loadingState.innerHTML = `
          <i class="fas fa-exclamation-circle text-danger" style="font-size: 3rem;"></i>
          <p class="mt-3 text-danger">Failed to load users. Please try again.</p>
        `;
      }
    }

    function updateStats() {
      document.getElementById('totalUsers').textContent = allUsers.length;

      const adminCount = allUsers.filter(u => u.role === 'admin').length;
      const userCount = allUsers.length - adminCount;
      const activeCount = Math.floor(allUsers.length * 0.7);

      document.getElementById('adminCount').textContent = adminCount;
      document.getElementById('userCount').textContent = userCount;
      document.getElementById('activeCount').textContent = activeCount;
    }

    function renderUsers(users) {
      const tbody = document.getElementById('userTableBody');
      const tableContainer = document.getElementById('tableContainer');
      const emptyState = document.getElementById('emptyState');

      if (users.length === 0) {
        tableContainer.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      tableContainer.style.display = 'block';
      emptyState.style.display = 'none';

      tbody.innerHTML = users.map(user => {
        const isAdmin = user.role === 'admin';
        const initial = user.username.charAt(0).toUpperCase();
        const createdDate = new Date(user.created_at).toLocaleDateString('en-GB');

        return `
          <tr>
            <td>
              <div class="user-info">
                <div class="user-avatar">${initial}</div>
                <div>
                  <div class="user-name">${user.username}</div>
                  <div class="user-email">ID: ${user.id}</div>
                </div>
              </div>
            </td>
            <td>
              <i class="fas fa-calendar me-2 text-muted"></i>${createdDate}
            </td>
            <td>
              <span class="badge-status ${isAdmin ? 'badge-admin' : 'badge-user'}">
                <i class="fas ${isAdmin ? 'fa-shield-alt' : 'fa-user'} me-1"></i>
                ${isAdmin ? 'Admin' : 'User'}
              </span>
            </td>
            <td class="text-center">
              <button class="action-btn btn-edit" onclick="editUser(${user.id})" title="Edit">
                <i class="fas fa-edit"></i>
              </button>
              <button class="action-btn btn-delete" onclick="deleteUser(${user.id})" title="Delete">
                <i class="fas fa-trash-alt"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = allUsers.filter(user =>
        user.username.toLowerCase().includes(searchTerm) ||
        user.role.toLowerCase().includes(searchTerm)
      );
      renderUsers(filtered);
    });

    function editUser(userId) {
      alert(`Edit user ${userId}`);
    }

    function deleteUser(userId) {
      if (confirm(`Are you sure you want to delete user ${userId}?`)) {
        alert(`User ${userId} deleted!`);
      }
    }

    loadUsers();
  </script>
</body>

</html>
