<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Microservice Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #7c3aed;
      --success-color: #10b981;
      --warning-color: #f59e0b;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary-color) !important;
      font-size: 1.5rem;
    }

    .main-container {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .page-header {
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 2.5rem;
    }

    .stats-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      border: 2px solid #f3f4f6;
      height: 100%;
    }

    .stats-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 20px -5px rgba(0, 0, 0, 0.15);
    }

    .stats-card.primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .stats-card.success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .stats-card.warning {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }

    .stats-icon {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: rgba(255, 255, 255, 0.2);
      margin-bottom: 1rem;
    }

    .stats-value {
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 0.25rem;
    }

    .stats-label {
      font-size: 0.875rem;
      opacity: 0.9;
      font-weight: 600;
    }

    .search-box {
      position: relative;
      margin-bottom: 2rem;
    }

    .search-box input {
      border-radius: 50px;
      padding: 1rem 3rem 1rem 3rem;
      border: 2px solid #e5e7eb;
      transition: all 0.3s;
      font-size: 1rem;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: all 0.3s;
      border: 2px solid #f3f4f6;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
      border-color: var(--primary-color);
    }

    .product-image {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 4rem;
    }

    .product-body {
      padding: 1.5rem;
    }

    .product-id {
      font-size: 0.75rem;
      color: #9ca3af;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .product-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 1rem;
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .product-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-view {
      flex: 1;
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-view:hover {
      background: var(--secondary-color);
      transform: scale(1.05);
    }

    .loading {
      text-align: center;
      padding: 3rem;
    }

    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state i {
      font-size: 5rem;
      color: #e5e7eb;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }

      .stats-value {
        font-size: 2rem;
      }

      .product-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fas fa-shopping-bag me-2"></i>Microservice Store
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="product.html"><i class="fas fa-box me-1"></i>Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="order.html"><i class="fas fa-shopping-cart me-1"></i>Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="auth.html"><i class="fas fa-users me-1"></i>Users</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="main-container">
      <div class="page-header">
        <h1><i class="fas fa-box-open me-2"></i>Product Catalog</h1>
        <p class="text-muted mb-0">Browse and manage all available products</p>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="stats-card primary">
            <div class="stats-icon">
              <i class="fas fa-boxes"></i>
            </div>
            <div class="stats-value" id="totalProducts">0</div>
            <div class="stats-label">Total Products</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="stats-card success">
            <div class="stats-icon">
              <i class="fas fa-dollar-sign"></i>
            </div>
            <div class="stats-value" id="avgPrice">$0</div>
            <div class="stats-label">Average Price</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="stats-card warning">
            <div class="stats-icon">
              <i class="fas fa-chart-line"></i>
            </div>
            <div class="stats-value" id="highestPrice">$0</div>
            <div class="stats-label">Highest Price</div>
          </div>
        </div>
      </div>

      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input type="text" class="form-control" id="searchInput" placeholder="Search products by name...">
      </div>

      <div id="loadingState" class="loading">
        <div class="loading-spinner mx-auto"></div>
        <p class="mt-3 text-muted">Loading products...</p>
      </div>

      <div id="productGrid" class="product-grid" style="display: none;">
        <!-- Products will be inserted here -->
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-box-open"></i>
        <h3>No products found</h3>
        <p class="text-muted">Try adjusting your search criteria.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    let allProducts = [];

    async function loadProducts() {
      const loadingState = document.getElementById('loadingState');
      const productGrid = document.getElementById('productGrid');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'block';
      productGrid.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const response = await fetch('/product/products');
        allProducts = await response.json();

        loadingState.style.display = 'none';

        if (allProducts.length === 0) {
          emptyState.style.display = 'block';
        } else {
          productGrid.style.display = 'grid';
          updateStats();
          renderProducts(allProducts);
        }
      } catch (error) {
        console.error('Error fetching products:', error);
        loadingState.innerHTML = `
          <i class="fas fa-exclamation-circle text-danger" style="font-size: 3rem;"></i>
          <p class="mt-3 text-danger">Failed to load products. Please try again.</p>
        `;
      }
    }

    function updateStats() {
      document.getElementById('totalProducts').textContent = allProducts.length;

      const prices = allProducts.map(p => parseFloat(p.price));
      const avgPrice = prices.reduce((a, b) => a + b, 0) / prices.length;
      const highestPrice = Math.max(...prices);

      document.getElementById('avgPrice').textContent = '$' + avgPrice.toFixed(2);
      document.getElementById('highestPrice').textContent = '$' + highestPrice.toFixed(2);
    }

    function renderProducts(products) {
      const productGrid = document.getElementById('productGrid');
      const emptyState = document.getElementById('emptyState');

      if (products.length === 0) {
        productGrid.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      productGrid.style.display = 'grid';
      emptyState.style.display = 'none';

      const icons = ['fa-laptop', 'fa-mobile-alt', 'fa-headphones', 'fa-camera', 'fa-gamepad', 'fa-tablet-alt'];

      productGrid.innerHTML = products.map((product, index) => {
        const icon = icons[index % icons.length];

        return `
          <div class="product-card">
            <div class="product-image">
              <i class="fas ${icon}"></i>
            </div>
            <div class="product-body">
              <div class="product-id">#${product.id}</div>
              <div class="product-name">${product.name}</div>
              <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
              <div class="product-actions">
                <button class="btn-view" onclick="viewProduct(${product.id})">
                  <i class="fas fa-eye me-2"></i>View Details
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = allProducts.filter(product =>
        product.name.toLowerCase().includes(searchTerm)
      );
      renderProducts(filtered);
    });

    function viewProduct(productId) {
      const product = allProducts.find(p => p.id === productId);
      alert(`Product Details:\n\nID: ${product.id}\nName: ${product.name}\nPrice: $${parseFloat(product.price).toFixed(2)}`);
    }

    loadProducts();
  </script>
</body>

</html>
