<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Microservice Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #4f46e5;
      --secondary-color: #7c3aed;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --info-color: #3b82f6;
      --dark-bg: #1f2937;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary-color) !important;
      font-size: 1.5rem;
    }

    .main-container {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    .page-header {
      border-bottom: 3px solid var(--primary-color);
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }

    .page-header h1 {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 2.5rem;
    }

    .stats-row {
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      border: 2px solid #e5e7eb;
      transition: all 0.3s;
      height: 100%;
    }

    .stat-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-5px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
    }

    .stat-icon {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .stat-icon.primary {
      background: rgba(79, 70, 229, 0.1);
      color: var(--primary-color);
    }

    .stat-icon.success {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-color);
    }

    .stat-icon.warning {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning-color);
    }

    .stat-icon.info {
      background: rgba(59, 130, 246, 0.1);
      color: var(--info-color);
    }

    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--dark-bg);
    }

    .stat-label {
      color: #6b7280;
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .search-filter-row {
      margin-bottom: 2rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      border-radius: 12px;
      padding: 0.75rem 1rem 0.75rem 2.5rem;
      border: 2px solid #e5e7eb;
      transition: all 0.3s;
      width: 100%;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
    }

    .filter-select {
      border-radius: 12px;
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      transition: all 0.3s;
    }

    .filter-select:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .order-card {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      border: 2px solid #e5e7eb;
      margin-bottom: 1rem;
      transition: all 0.3s;
    }

    .order-card:hover {
      border-color: var(--primary-color);
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.2);
      transform: translateY(-2px);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e5e7eb;
    }

    .order-id {
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--dark-bg);
    }

    .order-status {
      padding: 0.375rem 1rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .order-status.pending {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning-color);
    }

    .order-status.completed {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-color);
    }

    .order-status.processing {
      background: rgba(59, 130, 246, 0.1);
      color: var(--info-color);
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-label {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-weight: 600;
      color: var(--dark-bg);
      font-size: 1rem;
    }

    .order-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-action {
      padding: 0.5rem 1rem;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.3s;
      cursor: pointer;
    }

    .btn-action.primary {
      background: var(--primary-color);
      color: white;
    }

    .btn-action.primary:hover {
      background: var(--secondary-color);
      transform: scale(1.05);
    }

    .btn-action.secondary {
      background: #f3f4f6;
      color: #6b7280;
    }

    .btn-action.secondary:hover {
      background: #e5e7eb;
    }

    .loading {
      text-align: center;
      padding: 3rem;
    }

    .loading-spinner {
      width: 3rem;
      height: 3rem;
      border: 4px solid #e5e7eb;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
    }

    .empty-state i {
      font-size: 5rem;
      color: #e5e7eb;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }

      .order-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="fas fa-shopping-bag me-2"></i>Microservice Store
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="fas fa-home me-1"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="product.html"><i class="fas fa-box me-1"></i>Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="order.html"><i class="fas fa-shopping-cart me-1"></i>Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="auth.html"><i class="fas fa-users me-1"></i>Users</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="main-container">
      <!-- Header -->
      <div class="page-header">
        <h1><i class="fas fa-clipboard-list me-2"></i>Order Management</h1>
        <p class="text-muted mb-0">Track and manage customer orders</p>
      </div>

      <!-- Stats -->
      <div class="row g-4 stats-row">
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon primary">
              <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="stat-number" id="totalOrders">0</div>
            <div class="stat-label">Total Orders</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon warning">
              <i class="fas fa-clock"></i>
            </div>
            <div class="stat-number" id="pendingOrders">0</div>
            <div class="stat-label">Pending Orders</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon success">
              <i class="fas fa-check-circle"></i>
            </div>
            <div class="stat-number" id="completedOrders">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon info">
              <i class="fas fa-box"></i>
            </div>
            <div class="stat-number" id="totalQuantity">0</div>
            <div class="stat-label">Total Items</div>
          </div>
        </div>
      </div>

      <!-- Search & Filter -->
      <div class="row g-3 search-filter-row">
        <div class="col-12 col-md-8">
          <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="form-control" id="searchInput"
              placeholder="Search orders by ID, user, or product...">
          </div>
        </div>
        <div class="col-12 col-md-4">
          <select class="form-select filter-select" id="statusFilter">
            <option value="all">All Status</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="completed">Completed</option>
          </select>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loadingState" class="loading">
        <div class="loading-spinner mx-auto"></div>
        <p class="mt-3 text-muted">Loading orders...</p>
      </div>

      <!-- Orders List -->
      <div id="ordersList" style="display: none;">
        <!-- Orders will be inserted here -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <i class="fas fa-shopping-cart"></i>
        <h3>No orders found</h3>
        <p>Try adjusting your search or filter to find what you're looking for.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
  <script>
    let allOrders = [];

    // Fetch orders
    async function loadOrders() {
      const loadingState = document.getElementById('loadingState');
      const ordersList = document.getElementById('ordersList');
      const emptyState = document.getElementById('emptyState');

      loadingState.style.display = 'block';
      ordersList.style.display = 'none';
      emptyState.style.display = 'none';

      try {
        const response = await fetch('/order/orders');
        allOrders = await response.json();

        loadingState.style.display = 'none';

        if (allOrders.length === 0) {
          emptyState.style.display = 'block';
        } else {
          ordersList.style.display = 'block';
          renderOrders(allOrders);
          updateStats(allOrders);
        }
      } catch (error) {
        console.error('Error fetching orders:', error);
        loadingState.innerHTML = `
          <i class="fas fa-exclamation-circle text-danger" style="font-size: 3rem;"></i>
          <p class="mt-3 text-danger">Failed to load orders. Please try again.</p>
        `;
      }
    }

    // Update stats
    function updateStats(orders) {
      document.getElementById('totalOrders').textContent = orders.length;
      document.getElementById('pendingOrders').textContent = Math.floor(orders.length * 0.3);
      document.getElementById('completedOrders').textContent = Math.floor(orders.length * 0.6);

      const totalQty = orders.reduce((sum, order) => sum + order.quantity, 0);
      document.getElementById('totalQuantity').textContent = totalQty;
    }

    // Render orders
    function renderOrders(orders) {
      const ordersList = document.getElementById('ordersList');
      const emptyState = document.getElementById('emptyState');

      if (orders.length === 0) {
        ordersList.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }

      ordersList.style.display = 'block';
      emptyState.style.display = 'none';

      const statuses = ['pending', 'processing', 'completed'];

      ordersList.innerHTML = orders.map((order, index) => {
        const status = statuses[index % statuses.length];
        const date = new Date().toLocaleDateString();

        return `
          <div class="order-card">
            <div class="order-header">
              <div class="order-id">
                <i class="fas fa-hashtag"></i> Order ${order.id}
              </div>
              <span class="order-status ${status}">${status}</span>
            </div>
            <div class="order-details">
              <div class="detail-item">
                <div class="detail-label"><i class="fas fa-user me-1"></i>User ID</div>
                <div class="detail-value">#${order.user_id}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label"><i class="fas fa-box me-1"></i>Total</div>
                <div class="detail-value">#${order.total}</div>
              </div>
              <div class="detail-item">
                <div class="detail-label"><i class="fas fa-cubes me-1"></i>Status</div>
                <div class="detail-value">${order.status} items</div>
              </div>
              <div class="detail-item">
                <div class="detail-label"><i class="fas fa-calendar me-1"></i>Date</div>
                <div class="detail-value">${date}</div>
              </div>
            </div>
            <div class="order-actions">
              <button class="btn-action primary" onclick="viewOrder(${order.id})">
                <i class="fas fa-eye me-1"></i>View Details
              </button>
              <button class="btn-action secondary" onclick="updateStatus(${order.id})">
                <i class="fas fa-sync me-1"></i>Update Status
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Search functionality
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase();
      const filtered = allOrders.filter(order =>
        order.id.toString().includes(searchTerm) ||
        order.user_id.toString().includes(searchTerm) ||
        order.product_id.toString().includes(searchTerm)
      );
      renderOrders(filtered);
    });

    // Status filter
    document.getElementById('statusFilter').addEventListener('change', (e) => {
      // For now, show all orders (implement filtering logic as needed)
      renderOrders(allOrders);
    });

    // View order
    function viewOrder(orderId) {
      const order = allOrders.find(o => o.id === orderId);
      alert(`Order Details:\n\nOrder ID: ${order.id}\nUser ID: ${order.user_id}\nTotal : ${order.total}\nStatus: ${order.status}`);
    }

    // Update status
    function updateStatus(orderId) {
      alert(`Update status for Order #${orderId}`);
    }

    // Load orders on page load
    loadOrders();
  </script>
</body>

</html>
