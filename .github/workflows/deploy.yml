name: CI/CD Pipeline

# Khi nào workflow này chạy
on:
  push:
    branches:
      - develop  # Chạy khi push code lên nhánh develop
  pull_request:
    branches:
      - develop  # Chạy khi tạo pull request vào develop

jobs:
  # Job 1: Build và Test
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest
    
    steps:
      # Bước 1: Tải code về
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Bước 2: Setup Docker Buildx (để build image)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Bước 3: Build các Docker images
      - name: Build Auth Service
        run: |
          docker build -t auth-service:test ./auth_service
      
      - name: Build Product Service
        run: |
          docker build -t product-service:test ./product_service
      
      - name: Build Order Service
        run: |
          docker build -t order-service:test ./order_service
      
      # Bước 4: Kiểm tra cú pháp docker-compose
      - name: Validate docker-compose
        run: |
          docker compose config

  # Job 2: Deploy (chỉ chạy khi push lên develop)
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-test  # Chỉ chạy khi build-and-test thành công
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    
    steps:
      # Bước 1: Tải code về
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Bước 2: Login vào Docker Hub (để push images)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # Bước 3: Build và Push images lên Docker Hub
      - name: Build and Push Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./auth_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
      
      - name: Build and Push Product Service
        uses: docker/build-push-action@v5
        with:
          context: ./product_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-service:latest
      
      - name: Build and Push Order Service
        uses: docker/build-push-action@v5
        with:
          context: ./order_service
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest
      
      # Bước 4: Deploy lên server qua SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/microservices-demo
            git pull origin develop
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d
            docker system prune -f
